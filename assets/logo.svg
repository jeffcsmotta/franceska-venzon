<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2319"/>
      <stop offset="100%" stop-color="#1A0D08"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="74" height="74" rx="20" fill="url(#warmGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Outer decorative circle -->
    <circle cx="37" cy="37" r="30" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    <!-- Monogram FV -->
    <text x="37" y="44" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">FV</text>
    <path d="M26 51 C32 54, 42 54, 48 51" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="37" cy="22" r="2.5" fill="#D4AF37"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(98, 12)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="27" font-weight="800" fill="#2A170F" letter-spacing="2">FRANCESKA VENZON</text>
    
    <!-- Subtitle -->
    <text x="1" y="52" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#9C6644" letter-spacing="3.2" text-transform="uppercase">CONFEITARIA ARTESANAL &amp; CAFÉS ESPECIAIS</text>
    
    <!-- Origin Tag -->
    <text x="1" y="67" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="600" fill="#A87A5B" letter-spacing="1.5">CAXIAS DO SUL • LE CORDON BLEU &amp; OTTOLENGHI ALUMNI</text>
  </g>
</svg>
